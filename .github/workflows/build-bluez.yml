name: build-bluez

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  build-all:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
          - linux/arm/v7
        version:
          - "3.10_5.66"
          - "3.10_5.85"
          - "3.12_5.66"
          - "3.12_5.85"
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Build
        run: |
          PYTHON_VERSION=$(echo "${{ matrix.version }}" | cut -d'_' -f1)
          BLUEZ_VERSION=$(echo "${{ matrix.version }}" | cut -d'_' -f2)
          ./scripts/cp-build.sh ${{ matrix.platform }} $PYTHON_VERSION $BLUEZ_VERSION
      - name: Set artifact name
        id: artifact
        run: echo "name=dist-$(echo '${{ matrix.platform }}' | tr '/' '-')-${{ matrix.version }}" >> $GITHUB_OUTPUT
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: dist/*.tar.gz
  release:
    runs-on: ubuntu-latest
    needs: build-all
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
      - name: Release binaries
        uses: softprops/action-gh-release@v1
        with:
          files: "*.tar.gz"
